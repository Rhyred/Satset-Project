<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <title>SatSet - Pengaduan & Feed</title>
    <style>
        .report-container {
            max-width: 56rem;
            margin: 0 auto;
            margin-top: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .report-header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 640px) {
            .report-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: flex-end;
            }
        }

        .report-title h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--slate-800);
            letter-spacing: -0.015em;
        }

        .report-subtitle {
            font-size: 0.875rem;
            color: var(--slate-500);
            margin-top: 0.25rem;
        }

        .btn-new-report {
            background-color: var(--primary);
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.625rem 1rem;
            border-radius: 0.75rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .btn-new-report:hover {
            background-color: var(--primary-dark);
        }

        .tab-navigation {
            display: flex;
            border-bottom: 1px solid var(--border-card);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .tab-button {
            white-space: nowrap;
            padding: 0.75rem 0;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            background: none;
            border: none;
            color: var(--slate-500);
        }

        .tab-button:hover {
            color: var(--slate-700);
            border-bottom-color: var(--slate-300);
        }

        .tab-button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .report-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .report-card {
            background: var(--bg-card);
            padding: 1.25rem;
            border-radius: 1rem;
            border: 1px solid var(--border-card);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.2s;
        }

        .report-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .report-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .report-card-user {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .report-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .report-avatar.self {
            background-color: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .report-avatar.other {
            background-color: var(--slate-200);
            color: var(--slate-600);
        }

        .report-user-info p {
            font-weight: 600;
            color: var(--slate-800);
            font-size: 0.875rem;
            line-height: 1.5;
            margin: 0;
        }

        .report-date {
            font-size: 0.75rem;
            color: var(--slate-400) !important;
            font-weight: 400 !important;
        }

        .report-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-diterima { background-color: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .status-diproses { background-color: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .status-selesai { background-color: rgba(16, 185, 129, 0.15); color: #10b981; }
        .status-ditolak { background-color: rgba(220, 38, 38, 0.15); color: #dc2626; }

        .report-title-text {
            font-weight: 700;
            color: var(--slate-800);
            margin-bottom: 0.25rem;
        }

        .report-description {
            font-size: 0.875rem;
            color: var(--slate-600);
            margin-bottom: 0.75rem;
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            background: var(--bg-card);
            border-radius: 1.5rem;
            border: 2px dashed var(--border-card);
        }

        .empty-icon {
            width: 4rem;
            height: 4rem;
            background-color: var(--slate-100);
            color: var(--slate-400);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.75rem;
        }

        .empty-title {
            font-weight: 700;
            color: var(--slate-600);
            margin-bottom: 0.25rem;
        }

        .empty-text {
            font-size: 0.875rem;
            color: var(--slate-400);
            max-width: 28rem;
            margin: 0 auto 1rem;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1050;
            overflow-y: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }

        .modal-content-custom {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 32rem;
            width: 100%;
            z-index: 1051;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-card);
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--slate-800);
            margin: 0;
        }

        .modal-close {
            color: var(--slate-400);
            background-color: var(--slate-100);
            border-radius: 50%;
            padding: 0.375rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: var(--slate-600);
            background-color: var(--slate-200);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            display: flex;
            gap: 0.75rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border-card);
            background-color: var(--slate-50);
            justify-content: flex-end;
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
<div layout:fragment="header-title">Pengaduan Warga</div>
<div layout:fragment="content" class="report-container"
    x-data="reportApp">

    <!-- Header -->
    <div class="report-header">
        <div class="report-title">
            <h2>Laporan & Pengaduan</h2>
            <p class="report-subtitle">Sampaikan keluhan fasilitas publik atau pantau aduan di sekitar Anda.</p>
        </div>
        <button @click="showModal = true" class="btn-new-report">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Buat Laporan Baru
        </button>
    </div>

    <!-- Tab Navigation -->
    <div class="tab-navigation">
        <button @click="activeTab = 'mine'" class="tab-button" :class="activeTab === 'mine' ? 'active' : ''">
            Laporan Saya
        </button>
        <button @click="activeTab = 'community'" class="tab-button" :class="activeTab === 'community' ? 'active' : ''">
            Community Feed
        </button>
    </div>

    <!-- Tab Content: Laporan Saya -->
    <div x-show="activeTab === 'mine'">
        <div x-show="myLaporans.length === 0" class="empty-state">
            <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" x2="8" y1="13" y2="13"></line><line x1="16" x2="8" y1="17" y2="17"></line><line x1="10" x2="8" y1="9" y2="9"></line></svg>
            </div>
            <h3 class="empty-title">Belum ada laporan</h3>
            <p class="empty-text">Anda belum mengajukan laporan pengaduan apapun.</p>
        </div>

        <div class="report-list" x-show="myLaporans.length > 0">
            <template x-for="laporan in myLaporans" :key="laporan.id">
                <div class="report-card">
                    <div class="report-card-header">
                        <div class="report-card-user">
                            <div class="report-avatar self">Anda</div>
                            <div>
                                <div class="report-user-info">
                                    <p>Laporan #<span x-text="laporan.id"></span></p>
                                    <p class="report-date" x-text="formatDate(laporan.createdAt)"></p>
                                </div>
                            </div>
                        </div>
                        <div class="report-status" :class="'status-' + laporan.statusLaporan.toLowerCase()" x-text="laporan.statusLaporan"></div>
                    </div>
                    <h4 class="report-title-text" x-text="laporan.judulLaporan"></h4>
                    <p class="report-description" x-text="laporan.deskripsi"></p>
                    <div x-show="laporan.kategoriLayanan" style="margin-top: 0.5rem;">
                        <span class="badge-status status-diterima" style="font-size: 0.65rem;" x-text="laporan.kategoriLayanan.nama"></span>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Tab Content: Community Feed -->
    <div x-show="activeTab === 'community'" x-cloak>
        <div class="report-list" x-show="laporans.length > 0">
            <template x-for="laporan in laporans" :key="laporan.id">
                <div class="report-card">
                    <div class="report-card-header">
                        <div class="report-card-user">
                            <div class="report-avatar other" x-text="laporan.pelapor ? laporan.pelapor.namaLengkap.substring(0, 1).toUpperCase() : 'W'">W</div>
                            <div>
                                <div class="report-user-info">
                                    <p x-text="laporan.pelapor ? laporan.pelapor.namaLengkap : 'Warga Anonim'">Nama</p>
                                    <p class="report-date" x-text="formatDate(laporan.createdAt)"></p>
                                </div>
                            </div>
                        </div>
                        <div class="report-status" :class="'status-' + laporan.statusLaporan.toLowerCase()" x-text="laporan.statusLaporan"></div>
                    </div>
                    <h4 class="report-title-text" x-text="laporan.judulLaporan"></h4>
                    <p class="report-description" x-text="laporan.deskripsi"></p>
                    <div x-show="laporan.kategoriLayanan" style="margin-top: 0.5rem;">
                        <span class="badge-status status-diterima" style="font-size: 0.65rem;" x-text="laporan.kategoriLayanan.nama"></span>
                    </div>
                </div>
            </template>
        </div>

        <div x-show="laporans.length === 0" class="empty-state">
            <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line></svg>
            </div>
            <p class="empty-text">Belum ada laporan dari warga.</p>
        </div>
    </div>

    <!-- Create Report Modal -->
    <div x-show="showModal" x-cloak class="modal-overlay">
        <div class="modal-backdrop" @click="showModal = false"></div>
        <div class="modal-content-custom">

            <div class="modal-header">
                <h3 class="modal-title">Buat Laporan Baru</h3>
                <button @click="showModal = false" class="modal-close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <div class="modal-body">
                <form>
                    <div class="form-group">
                        <label class="form-label" style="color: var(--slate-700);">Kategori Layanan</label>
                        <select x-model="newReport.kategoriId" class="form-input" style="background-color: var(--bg-card); border-color: var(--border-card); color: var(--slate-800);">
                            <template x-for="cat in categories" :key="cat.id">
                                <option :value="cat.id" x-text="cat.nama"></option>
                            </template>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" style="color: var(--slate-700);">Judul Laporan</label>
                        <input type="text" x-model="newReport.judulLaporan" class="form-input" style="background-color: var(--bg-card); border-color: var(--border-card); color: var(--slate-800);" placeholder="Misal: Jalan berlubang di depan pasar">
                    </div>
                    <div class="form-group">
                        <label class="form-label" style="color: var(--slate-700);">Deskripsi Detail</label>
                        <textarea rows="4" x-model="newReport.deskripsi" class="form-textarea" style="background-color: var(--bg-card); border-color: var(--border-card); color: var(--slate-800);" placeholder="Ceritakan detail masalah, lokasi akurat, dan kondisi saat ini..."></textarea>
                    </div>
                </form>
            </div>

            <div class="modal-footer" style="background-color: var(--slate-100);">
                <button type="button" @click="showModal = false" class="btn-secondary">
                    Batal
                </button>
                <button type="button" @click="submitReport" :disabled="loading" class="btn-primary">
                    <span x-show="!loading">Kirim Laporan</span>
                    <span x-show="loading">Mengirim...</span>
                </button>
            </div>
        </div>
    </div>

</div>
<th:block layout:fragment="script">
    <script th:inline="javascript">
        document.addEventListener('alpine:init', () => {
            Alpine.data('reportApp', () => ({
                activeTab: 'community',
                showModal: false,
                laporans: [],
                categories: [],
                currentUserId: /*[[${currentUser != null ? currentUser.id : 0}]]*/ 0,
                newReport: { judulLaporan: '', deskripsi: '', kategoriId: null, userId: null },
                loading: false,
                init() {
                    this.newReport.userId = this.currentUserId;
                    this.fetchLaporan();
                    this.fetchCategories();
                },
                async fetchLaporan() {
                    try {
                        let res = await fetch('/api/laporan');
                        let data = await res.json();
                        this.laporans = data.sort((a,b) => b.id - a.id);
                    } catch(e) {
                        console.error('Error fetching reports:', e);
                    }
                },
                async fetchCategories() {
                    try {
                        let res = await fetch('/api/kategori-layanan');
                        let data = await res.json();
                        this.categories = data;
                        if (data.length > 0) {
                            this.newReport.kategoriId = data[0].id;
                        }
                    } catch(e) {
                        console.error('Error fetching categories:', e);
                    }
                },
                async submitReport() {
                    if(!this.newReport.judulLaporan || !this.newReport.deskripsi || !this.newReport.kategoriId) {
                        this.$root.showToast('Semua input harus diisi!', 'danger');
                        return;
                    }
                    this.loading = true;
                    try {
                        let res = await fetch('/api/laporan', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.newReport)
                        });
                        let data = await res.json();
                        if(data.success) {
                            this.showModal = false;
                            this.newReport.judulLaporan = '';
                            this.newReport.deskripsi = '';
                            await this.fetchLaporan();
                            this.activeTab = 'mine';
                            this.$root.showToast('Laporan berhasil dikirim!');
                        }
                    } catch(e) {
                        console.error('Error submitting report:', e);
                        this.$root.showToast('Gagal mengirim laporan.', 'danger');
                    } finally {
                        this.loading = false;
                    }
                },
                get myLaporans() {
                    return this.laporans.filter(l => l.userId === this.currentUserId);
                },
                formatDate(dateStr) {
                    if(!dateStr) return '';
                    return new Date(dateStr).toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                }
            }));
        });
    </script>
</th:block>
</body>
</html>
