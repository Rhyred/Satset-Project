<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Akun - SatSet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] flex items-center justify-center min-h-screen font-sans p-4">

    <div class="w-full max-w-xl bg-[#1e293b] rounded-2xl shadow-xl p-8 border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">Daftar Akun</h1>
            <p class="text-slate-400 text-sm">Silakan buat akun baru untuk mengakses SatSet.</p>
        </div>

        <form th:action="@{/auth/register}" method="POST" class="space-y-5">
            <div>
                <label class="block text-slate-300 font-medium text-sm mb-2">NIK</label>
                <input type="text" name="nik" required placeholder="16 digit NIK" 
                       class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-slate-300 font-medium text-sm mb-2">Nama lengkap</label>
                <input type="text" name="namaLengkap" required placeholder="Nama sesuai KTP" 
                       class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-slate-300 font-medium text-sm mb-2">Username</label>
                <input type="text" name="username" required placeholder="Pilih username" 
                       class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-slate-300 font-medium text-sm mb-2">Email</label>
                <input type="email" name="email" required placeholder="nama@email.com" 
                       class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-slate-300 font-medium text-sm mb-2">Password</label>
                <input type="password" name="password" required placeholder="Masukkan kata sandi" 
                       class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-slate-300 font-medium text-sm mb-2">No. Telepon</label>
                <input type="text" name="noTelp" required placeholder="08xxxxxxxxxx" 
                       class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-slate-300 font-medium text-sm mb-2">Alamat</label>
                <textarea name="alamat" rows="3" required placeholder="Alamat lengkap" 
                          class="w-full bg-[#0f172a] border border-slate-600 rounded-xl p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3.5 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 mt-4">
                Daftar Akun 🚀
            </button>
        </form>

        <div class="text-center mt-6">
            <p class="text-slate-400 text-sm">Sudah punya akun? <a th:href="@{/auth/login}" class="text-blue-400 hover:underline">Masuk di sini</a></p>
        </div>
    </div>

</body>
</html>
