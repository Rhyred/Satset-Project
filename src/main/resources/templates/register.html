<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatSet - Registrasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #e2e8f0;
            padding: 2rem;
        }
        .register-card {
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(2rem); }
            to { opacity: 1; transform: translateY(0); }
        }
        .register-card h2 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
        .register-card .subtitle { color: #64748b; font-size: 0.875rem; margin-bottom: 2rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media(max-width:480px) { .form-row { grid-template-columns: 1fr; } }
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.8125rem; font-weight: 500; color: #94a3b8; margin-bottom: 0.375rem; }
        .form-input {
            width: 100%;
            padding: 0.625rem 1rem;
            background: rgba(30,41,59,0.8);
            border: 1px solid #334155;
            border-radius: 0.75rem;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 0.875rem;
            transition: all 0.2s;
            outline: none;
        }
        .form-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .form-input::placeholder { color: #475569; }
        .btn-register {
            width: 100%;
            padding: 0.8125rem;
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }
        .btn-register:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,246,0.3); }
        .btn-register:disabled { opacity: 0.6; cursor: not-allowed; }
        .login-link { text-align: center; font-size: 0.875rem; color: #64748b; margin-top: 1.5rem; }
        .login-link a { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .login-link a:hover { text-decoration: underline; }
        .error-message {
            background: rgba(220,38,38,0.1);
            border: 1px solid rgba(220,38,38,0.3);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        .success-message {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            color: #6ee7b7;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
    <div class="register-card" x-data="{
        form: { nik: '', namaLengkap: '', username: '', email: '', password: '', noTelepon: '', alamat: '' },
        loading: false, error: '', success: false,
        async register() {
            if(!this.form.nik || !this.form.namaLengkap || !this.form.email || !this.form.password || !this.form.username) {
                this.error = 'Semua field wajib harus diisi'; return;
            }
            this.loading = true; this.error = '';
            try {
                let res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.form)
                });
                let data = await res.json();
                if(data.success) {
                    this.success = true;
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    this.error = data.message || 'Registrasi gagal';
                }
            } catch(e) {
                this.error = 'Terjadi kesalahan koneksi';
            } finally {
                this.loading = false;
            }
        }
    }">
        <h2>Daftar Akun</h2>
        <p class="subtitle">Buat akun baru untuk mengakses layanan SatSet</p>

        <div x-show="error" x-cloak class="error-message" x-text="error"></div>
        <div x-show="success" x-cloak class="success-message">Registrasi berhasil! Mengarahkan ke halaman login...</div>

        <form @submit.prevent="register">
            <div class="form-group">
                <label class="form-label">NIK (Nomor Induk Kependudukan) *</label>
                <input type="text" x-model="form.nik" class="form-input" placeholder="16 digit NIK" maxlength="16">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Nama Lengkap *</label>
                    <input type="text" x-model="form.namaLengkap" class="form-input" placeholder="Nama sesuai KTP">
                </div>
                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input type="text" x-model="form.username" class="form-input" placeholder="Pilih username">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Email *</label>
                    <input type="email" x-model="form.email" class="form-input" placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" x-model="form.password" class="form-input" placeholder="Min. 4 karakter">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">No. Telepon</label>
                    <input type="text" x-model="form.noTelepon" class="form-input" placeholder="08xxxxxxxxxx">
                </div>
                <div class="form-group">
                    <label class="form-label">Alamat</label>
                    <input type="text" x-model="form.alamat" class="form-input" placeholder="Alamat tempat tinggal">
                </div>
            </div>
            <button type="submit" class="btn-register" :disabled="loading">
                <span x-show="!loading">Daftar</span>
                <span x-show="loading">Memproses...</span>
            </button>
        </form>

        <p class="login-link">Sudah punya akun? <a href="/login">Masuk di sini</a></p>
    </div>
</body>
</html>
