<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <title>SatSet - Profil Akun</title>
    <style>
        .account-container {
            max-width: 48rem;
            margin: 0 auto;
            margin-top: 1.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .profile-header {
            background: var(--bg-card);
            border-radius: 1.5rem;
            border: 1px solid var(--border-card);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            overflow: hidden;
            animation: slideInDown 0.5s ease-out;
        }

        .profile-banner {
            background: linear-gradient(to right, #1e40af, #60a5fa);
            height: 8rem;
        }

        .profile-body {
            padding: 1.5rem 1.5rem 2rem;
            position: relative;
        }

        .profile-avatar {
            width: 6rem;
            height: 6rem;
            background: var(--bg-card);
            border-radius: 50%;
            padding: 0.375rem;
            position: absolute;
            top: -3rem;
            border: 1px solid var(--border-card);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-avatar-inner {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e40af, #60a5fa);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.5rem;
        }

        .profile-info {
            margin-top: 3.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .profile-info {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .profile-name h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--slate-800);
            margin: 0;
        }

        .profile-nik {
            color: var(--slate-500);
            font-weight: 500;
            margin: 0.25rem 0 0 0;
        }

        .badge-verified {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.75rem;
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .account-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .account-grid {
                grid-template-columns: 1fr 2fr;
            }
        }

        .sidebar-card {
            background: var(--bg-card);
            border-radius: 1rem;
            border: 1px solid var(--border-card);
            padding: 1.5rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .sidebar-card:hover {
            border-color: var(--slate-300);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .card-title {
            font-weight: 700;
            color: var(--slate-800);
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-card);
        }

        .data-item {
            margin-bottom: 1rem;
        }

        .data-label {
            font-size: 0.75rem;
            color: var(--slate-400);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.25rem;
        }

        .data-value {
            font-size: 0.875rem;
            color: var(--slate-700);
            font-weight: 500;
        }

        .edit-button {
            width: 100%;
            padding: 0.5rem 1rem;
            background-color: var(--slate-100);
            color: var(--slate-700);
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 0.75rem;
            border: 1px solid var(--border-card);
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1.5rem;
        }

        .edit-button:hover {
            background-color: var(--slate-200);
            color: var(--primary);
        }

        .activity-section h3 {
            font-weight: 700;
            color: var(--slate-800);
            font-size: 1.125rem;
            margin-bottom: 1rem;
            margin-top: 0;
        }

        .activity-box {
            background: var(--bg-card);
            border-radius: 1rem;
            border: 1px solid var(--border-card);
            overflow: hidden;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .activity-item {
            padding: 1.25rem;
            display: flex;
            gap: 1rem;
            border-bottom: 1px solid var(--border-card);
            transition: background-color 0.2s;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-item:hover {
            background-color: var(--slate-100);
        }

        .activity-avatar {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        .activity-avatar.queue {
            background-color: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .activity-avatar.report {
            background-color: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .activity-content {
            flex: 1;
        }

        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.25rem;
        }

        .activity-title {
            font-weight: 600;
            color: var(--slate-800);
            margin: 0;
        }

        .activity-date {
            font-size: 0.625rem;
            font-weight: 500;
            color: var(--slate-400);
        }

        .activity-description {
            font-size: 0.875rem;
            color: var(--slate-500);
            margin-bottom: 0.5rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-menunggu, .status-diterima { background-color: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .status-dipanggil, .status-diproses { background-color: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .status-dilayani { background-color: rgba(124, 58, 237, 0.15); color: #7c3aed; }
        .status-selesai { background-color: rgba(16, 185, 129, 0.15); color: #10b981; }
        .status-ditolak { background-color: rgba(220, 38, 38, 0.15); color: #dc2626; }

        .empty-state {
            padding: 2rem;
            text-align: center;
            color: var(--slate-400);
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1050;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }
        .modal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 1rem;
            width: 100%;
            max-width: 500px;
            padding: 1.5rem;
            z-index: 1051;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
<div layout:fragment="header-title">Profil Warga</div>
<div layout:fragment="content" class="account-container" x-data="profileApp">

    <!-- Profile Header -->
    <div class="profile-header">
        <div class="profile-banner"></div>
        <div class="profile-body">
            <div class="profile-avatar">
                <div class="profile-avatar-inner" x-text="user.namaLengkap ? user.namaLengkap.substring(0,1).toUpperCase() : 'U'">W</div>
            </div>

            <div class="profile-info">
                <div class="profile-name">
                    <h1 x-text="user.namaLengkap">Nama Warga</h1>
                    <p class="profile-nik" x-text="'NIK: ' + user.nik">NIK</p>
                </div>
                <div class="badge-verified">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"></circle><polyline points="12 7 15 10 9 16" style="stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"></polyline></svg>
                    Akun Terverifikasi
                </div>
            </div>
        </div>
    </div>

    <div class="account-grid">
        <div>
            <div class="sidebar-card">
                <h3 class="card-title">Data Pribadi</h3>
                <div class="data-item">
                    <p class="data-label">Email</p>
                    <p class="data-value" x-text="user.email || '-'"></p>
                </div>
                <div class="data-item">
                    <p class="data-label">No Telepon</p>
                    <p class="data-value" x-text="user.noTelepon || '-'"></p>
                </div>
                <div class="data-item">
                    <p class="data-label">Alamat</p>
                    <p class="data-value" x-text="user.alamat || '-'"></p>
                </div>
                <button class="edit-button" @click="openEditModal">Edit Profil</button>
            </div>
        </div>

        <div class="activity-section">
            <h3>Riwayat Aktivitas</h3>

            <div class="activity-box">
                <template x-for="antrean in antreans" :key="'A'+antrean.id">
                    <div class="activity-item">
                        <div class="activity-avatar queue">A</div>
                        <div class="activity-content">
                            <div class="activity-header">
                                <h4 class="activity-title">Antrean <span class="font-bold" x-text="antrean.nomorAntrian"></span></h4>
                                <span class="activity-date" x-text="formatDate(antrean.createdAt)"></span>
                            </div>
                            <p class="activity-description" x-text="antrean.jenisSurat"></p>
                            <span class="status-badge" :class="'status-' + antrean.statusAntrian.toLowerCase()" x-text="antrean.statusAntrian"></span>
                        </div>
                    </div>
                </template>

                <template x-for="laporan in laporans" :key="'L'+laporan.id">
                    <div class="activity-item">
                        <div class="activity-avatar report">L</div>
                        <div class="activity-content">
                            <div class="activity-header">
                                <h4 class="activity-title" x-text="laporan.judulLaporan"></h4>
                                <span class="activity-date" x-text="formatDate(laporan.createdAt)"></span>
                            </div>
                            <p class="activity-description" x-text="laporan.deskripsi"></p>
                            <span class="status-badge" :class="'status-' + laporan.statusLaporan.toLowerCase()" x-text="laporan.statusLaporan"></span>
                        </div>
                    </div>
                </template>

                <div x-show="antreans.length === 0 && laporans.length === 0" class="empty-state">
                    Belum ada riwayat aktivitas.
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div x-show="showEditModal" x-cloak class="modal-overlay">
        <div class="modal-backdrop" @click="showEditModal = false"></div>
        <div class="modal-card">
            <h3 style="font-weight: 700; margin-bottom: 1.25rem; color: var(--slate-800);">Edit Profil Warga</h3>
            
            <div class="form-group">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" x-model="editData.namaLengkap" class="form-input">
            </div>
            <div class="form-group mt-2">
                <label class="form-label">Email</label>
                <input type="email" x-model="editData.email" class="form-input">
            </div>
            <div class="form-group mt-2">
                <label class="form-label">No Telepon</label>
                <input type="text" x-model="editData.noTelepon" class="form-input">
            </div>
            <div class="form-group mt-2">
                <label class="form-label">Alamat</label>
                <input type="text" x-model="editData.alamat" class="form-input">
            </div>
            
            <div class="d-flex justify-content-end gap-2 mt-4">
                <button class="btn-secondary btn-action" @click="showEditModal = false">Batal</button>
                <button class="btn-primary btn-action" @click="saveProfile" :disabled="saving">
                    <span x-show="!saving">Simpan</span>
                    <span x-show="saving">Menyimpan...</span>
                </button>
            </div>
        </div>
    </div>

</div>
<th:block layout:fragment="script">
    <script th:inline="javascript">
        document.addEventListener('alpine:init', () => {
            Alpine.data('profileApp', () => ({
                user: {
                    id: /*[[${currentUser != null ? currentUser.id : 0}]]*/ 0,
                    namaLengkap: /*[[${currentUser != null ? currentUser.namaLengkap : ''}]]*/ '',
                    nik: /*[[${currentUser != null ? currentUser.nik : ''}]]*/ '',
                    email: /*[[${currentUser != null ? currentUser.email : ''}]]*/ '',
                    noTelepon: /*[[${currentUser != null ? currentUser.noTelepon : ''}]]*/ '',
                    alamat: /*[[${currentUser != null ? currentUser.alamat : ''}]]*/ ''
                },
                editData: {},
                showEditModal: false,
                saving: false,
                antreans: [],
                laporans: [],
                init() {
                    this.fetchActivity();
                },
                async fetchActivity() {
                    try {
                        let [resA, resL] = await Promise.all([
                            fetch('/api/antrean'),
                            fetch('/api/laporan')
                        ]);
                        let allAntrean = await resA.json();
                        let allLaporan = await resL.json();
                        this.antreans = allAntrean.filter(a => a.userId === this.user.id).sort((a,b) => b.id - a.id);
                        this.laporans = allLaporan.filter(l => l.userId === this.user.id).sort((a,b) => b.id - a.id);
                    } catch(e) {
                        console.error('Error fetching data:', e);
                    }
                },
                openEditModal() {
                    this.editData = { ...this.user };
                    this.showEditModal = true;
                },
                async saveProfile() {
                    if (!this.editData.namaLengkap) {
                        this.$root.showToast('Nama lengkap wajib diisi!', 'danger');
                        return;
                    }
                    this.saving = true;
                    try {
                        let res = await fetch(`/api/users/${this.user.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.editData)
                        });
                        if (res.ok) {
                            let updatedUser = await res.json();
                            this.user = updatedUser;
                            this.showEditModal = false;
                            this.$root.showToast('Profil berhasil disimpan');
                            // Reload page to reflect layout avatar changes
                            setTimeout(() => window.location.reload(), 1000);
                        }
                    } catch (e) {
                        console.error(e);
                        this.$root.showToast('Gagal menyimpan profil', 'danger');
                    } finally {
                        this.saving = false;
                    }
                },
                formatDate(dateStr) {
                    if(!dateStr) return '';
                    return new Date(dateStr).toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
                }
            }));
        });
    </script>
</th:block>
</body>
</html>
