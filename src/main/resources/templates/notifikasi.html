<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <title>SatSet - Notifikasi Anda</title>
    <style>
        .notif-container {
            max-width: 48rem;
            margin: 0 auto;
            margin-top: 1.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .notif-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .notif-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--slate-800);
            margin: 0;
        }

        .notif-subtitle {
            font-size: 0.875rem;
            color: var(--slate-500);
            margin-top: 0.25rem;
        }

        .btn-clear {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--primary);
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-clear:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .notif-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 1rem;
            padding: 1.25rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            position: relative;
            transition: all 0.2s;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            animation: slideInUp 0.3s ease-out;
        }

        .notif-card.unread {
            background-color: rgba(59, 130, 246, 0.05);
            border-color: rgba(59, 130, 246, 0.2);
        }

        .notif-card.unread::before {
            content: '';
            position: absolute;
            top: 1.25rem;
            left: 0.5rem;
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background-color: #3b82f6;
        }

        .notif-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .notif-icon-box {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(30, 64, 175, 0.1);
            color: var(--primary);
            flex-shrink: 0;
        }

        .notif-card.unread .notif-icon-box {
            background-color: #3b82f6;
            color: white;
        }

        .notif-content {
            flex: 1;
        }

        .notif-message {
            font-size: 0.875rem;
            color: var(--slate-700);
            line-height: 1.5;
            margin: 0 0 0.375rem 0;
        }

        .notif-time {
            font-size: 0.75rem;
            color: var(--slate-400);
            font-weight: 500;
        }

        .notif-actions {
            display: flex;
            gap: 0.5rem;
            opacity: 0.8;
        }

        .btn-action-icon {
            background: none;
            border: none;
            color: var(--slate-400);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 0.375rem;
            transition: all 0.2s;
        }

        .btn-action-icon:hover {
            background-color: var(--slate-100);
            color: var(--slate-700);
        }

        .btn-action-icon.delete:hover {
            background-color: rgba(220, 38, 38, 0.1);
            color: #dc2626;
        }

        .filter-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-card);
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .filter-tab {
            padding: 0.75rem 0;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            background: none;
            border: none;
            color: var(--slate-500);
        }

        .filter-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            background: var(--bg-card);
            border-radius: 1.5rem;
            border: 2px dashed var(--border-card);
            color: var(--slate-400);
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(1rem); }
            to { opacity: 1; transform: translateY(0); }
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
<div layout:fragment="header-title">Notifikasi</div>
<div layout:fragment="content" class="notif-container" x-data="notifApp">

    <!-- Header -->
    <div class="notif-header">
        <div>
            <h2>Pusat Notifikasi</h2>
            <p class="notif-subtitle">Pantau perkembangan status pengaduan dan antrean birokrasi Anda.</p>
        </div>
        <button x-show="unreadCount > 0" @click="markAllRead" class="btn-clear">
            Tandai semua dibaca
        </button>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
        <button @click="filter = 'all'" class="filter-tab" :class="filter === 'all' ? 'active' : ''">
            Semua (<span x-text="notifs.length">0</span>)
        </button>
        <button @click="filter = 'unread'" class="filter-tab" :class="filter === 'unread' ? 'active' : ''">
            Belum Dibaca (<span x-text="unreadCount">0</span>)
        </button>
    </div>

    <!-- Notifications List -->
    <div class="notif-list" x-show="filteredNotifs.length > 0">
        <template x-for="notif in filteredNotifs" :key="notif.id">
            <div class="notif-card" :class="!notif.isRead ? 'unread' : ''">
                <div class="notif-icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                </div>
                <div class="notif-content">
                    <p class="notif-message" x-text="notif.pesan">Isi notifikasi</p>
                    <span class="notif-time" x-text="formatDate(notif.createdAt)">Waktu</span>
                </div>
                <div class="notif-actions">
                    <button x-show="!notif.isRead" @click="markRead(notif.id)" class="btn-action-icon" title="Tandai dibaca">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </button>
                    <button @click="deleteNotif(notif.id)" class="btn-action-icon delete" title="Hapus">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                    </button>
                </div>
            </div>
        </template>
    </div>

    <!-- Empty State -->
    <div x-show="filteredNotifs.length === 0" class="empty-state" x-cloak>
        <div class="notif-icon-box" style="margin: 0 auto 1rem; width: 3.5rem; height: 3.5rem; background-color: var(--slate-100); color: var(--slate-400);">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </div>
        <h3 style="font-weight: 700; color: var(--slate-600); margin-bottom: 0.25rem;">Tidak ada notifikasi</h3>
        <p style="font-size: 0.875rem; color: var(--slate-400); margin: 0;">Semua pemberitahuan Anda akan muncul di sini.</p>
    </div>

</div>
<th:block layout:fragment="script">
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('notifApp', () => ({
                notifs: [],
                filter: 'all',
                init() {
                    this.fetchNotifications();
                },
                async fetchNotifications() {
                    try {
                        let res = await fetch('/api/notifikasi/my');
                        if (res.ok) {
                            this.notifs = await res.json();
                            this.notifs.sort((a,b) => b.id - a.id);
                        }
                    } catch(e) {
                        console.error('Error fetching notifications:', e);
                    }
                },
                get unreadCount() {
                    return this.notifs.filter(n => !n.isRead).length;
                },
                get filteredNotifs() {
                    if (this.filter === 'all') return this.notifs;
                    return this.notifs.filter(n => !n.isRead);
                },
                async markRead(id) {
                    try {
                        let res = await fetch(`/api/notifikasi/${id}/read`, { method: 'PUT' });
                        if (res.ok) {
                            let item = this.notifs.find(n => n.id === id);
                            if (item) item.isRead = true;
                            // Update layout count badge
                            if (window.dispatchEvent) {
                                window.dispatchEvent(new CustomEvent('update-unread-notif'));
                            }
                            this.$root.showToast('Notifikasi ditandai dibaca');
                        }
                    } catch(e) {
                        console.error(e);
                    }
                },
                async markAllRead() {
                    let unreads = this.notifs.filter(n => !n.isRead);
                    try {
                        await Promise.all(unreads.map(n => 
                            fetch(`/api/notifikasi/${n.id}/read`, { method: 'PUT' })
                        ));
                        this.notifs.forEach(n => n.isRead = true);
                        if (window.dispatchEvent) {
                            window.dispatchEvent(new CustomEvent('update-unread-notif'));
                        }
                        this.$root.showToast('Semua notifikasi ditandai dibaca');
                    } catch(e) {
                        console.error(e);
                    }
                },
                async deleteNotif(id) {
                    try {
                        let res = await fetch(`/api/notifikasi/${id}`, { method: 'DELETE' });
                        if (res.ok) {
                            this.notifs = this.notifs.filter(n => n.id !== id);
                            if (window.dispatchEvent) {
                                window.dispatchEvent(new CustomEvent('update-unread-notif'));
                            }
                            this.$root.showToast('Notifikasi berhasil dihapus');
                        }
                    } catch(e) {
                        console.error(e);
                    }
                },
                formatDate(dateStr) {
                    if(!dateStr) return '';
                    const d = new Date(dateStr);
                    return d.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                }
            }));
        });
    </script>
</th:block>
</body>
</html>
