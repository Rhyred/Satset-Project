<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <title>SatSet - Mading Digital</title>
    <style>
        .mading-container {
            max-width: 48rem;
            margin: 0 auto;
            margin-top: 1.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .mading-header {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            .mading-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .mading-title h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--slate-800);
            letter-spacing: -0.015em;
            margin: 0;
        }

        .mading-subtitle {
            font-size: 0.875rem;
            color: var(--slate-500);
            margin-top: 0.25rem;
        }

        .filter-group {
            background: var(--bg-card);
            border-radius: 0.75rem;
            border: 1px solid var(--border-card);
            padding: 0.25rem;
            display: flex;
            gap: 0.25rem;
        }

        .filter-button {
            padding: 0.375rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background-color: transparent;
            color: var(--slate-500);
        }

        .filter-button:hover {
            color: var(--slate-800);
        }

        .filter-button.active {
            background-color: var(--primary);
            color: white;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 0.625rem 1rem 0.625rem 2.5rem;
            border: 1px solid var(--border-card);
            border-radius: 0.75rem;
            font-size: 0.875rem;
            background-color: var(--bg-card);
            color: var(--slate-800);
        }

        .search-icon {
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--slate-400);
            pointer-events: none;
        }

        .mading-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .mading-card {
            background: var(--bg-card);
            border-radius: 1rem;
            border: 1px solid var(--border-card);
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            overflow: hidden;
            position: relative;
            transition: all 0.2s;
            animation: slideInUp 0.4s ease-out;
        }

        .mading-card.penting::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0.375rem;
            height: 100%;
            background-color: #ef4444;
        }

        .mading-card.penting {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .mading-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .mading-content {
            padding: 1.5rem;
        }

        .mading-card.penting .mading-content {
            padding-left: 1.75rem;
        }

        .mading-header-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .mading-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.625rem;
            border-radius: 0.375rem;
            font-size: 0.725rem;
            font-weight: 700;
        }

        .badge-penting {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .badge-info_warga {
            background-color: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .badge-pengumuman {
            background-color: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        .mading-date {
            font-size: 0.75rem;
            color: var(--slate-400);
            font-weight: 500;
        }

        .mading-title-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--slate-800);
            margin-bottom: 0.5rem;
            margin-top: 0;
        }

        .mading-body {
            font-size: 0.875rem;
            color: var(--slate-600);
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--slate-400);
            background: var(--bg-card);
            border-radius: 1rem;
            border: 1px solid var(--border-card);
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(1rem); }
            to { opacity: 1; transform: translateY(0); }
        }

        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
<div layout:fragment="header-title">Mading Digital</div>
<div layout:fragment="content" class="mading-container" x-data="madingApp">

    <!-- Header -->
    <div class="mading-header">
        <div class="mading-title">
            <h2>Informasi Publik</h2>
            <p class="mading-subtitle">Pemberitahuan, pengumuman, dan berita terbaru dari admin.</p>
        </div>

        <div class="filter-group">
            <button @click="filter = 'SEMUA'" class="filter-button" :class="filter === 'SEMUA' ? 'active' : ''">Semua</button>
            <button @click="filter = 'PENTING'" class="filter-button" :class="filter === 'PENTING' ? 'active' : ''">Penting</button>
            <button @click="filter = 'INFO_WARGA'" class="filter-button" :class="filter === 'INFO_WARGA' ? 'active' : ''">Info Warga</button>
            <button @click="filter = 'PENGUMUMAN'" class="filter-button" :class="filter === 'PENGUMUMAN' ? 'active' : ''">Pengumuman</button>
        </div>
    </div>

    <!-- Search bar -->
    <div class="search-box">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" x-model="searchQuery" class="search-input" placeholder="Cari berdasarkan judul atau isi informasi...">
    </div>

    <!-- Mading Items -->
    <div class="mading-list" x-show="filteredMadings.length > 0">
        <template x-for="mading in filteredMadings" :key="mading.id">
            <article class="mading-card" :class="mading.jenisInformasi === 'PENTING' ? 'penting' : ''">
                <div class="mading-content">
                    <div class="mading-header-meta">
                        <span class="mading-badge" :class="'badge-' + mading.jenisInformasi.toLowerCase()">
                            <span x-text="mading.jenisInformasi.replace('_', ' ')"></span>
                        </span>
                        <span class="mading-date">Diunggah pada <span x-text="formatDate(mading.createdAt)"></span></span>
                    </div>
                    <h3 class="mading-title-text" x-text="mading.judul"></h3>
                    <p class="mading-body" x-text="mading.konten"></p>
                </div>
            </article>
        </template>
    </div>

    <!-- Empty State -->
    <div x-show="filteredMadings.length === 0" class="empty-state" x-cloak>
        Tidak ada informasi mading yang ditemukan.
    </div>

</div>
<th:block layout:fragment="script">
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('madingApp', () => ({
                madings: [],
                filter: 'SEMUA',
                searchQuery: '',
                init() {
                    this.fetchMading();
                },
                async fetchMading() {
                    try {
                        let res = await fetch('/api/mading');
                        this.madings = await res.json();
                    } catch(e) {
                        console.error('Error fetching madings:', e);
                    }
                },
                get filteredMadings() {
                    let list = this.madings;
                    if(this.filter !== 'SEMUA') {
                        list = list.filter(m => m.jenisInformasi === this.filter);
                    }
                    if(this.searchQuery.trim() !== '') {
                        let query = this.searchQuery.toLowerCase();
                        list = list.filter(m => m.judul.toLowerCase().includes(query) || m.konten.toLowerCase().includes(query));
                    }
                    return list;
                },
                formatDate(dateStr) {
                    if(!dateStr) return '';
                    const d = new Date(dateStr);
                    return d.toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                }
            }));
        });
    </script>
</th:block>
</body>
</html>
